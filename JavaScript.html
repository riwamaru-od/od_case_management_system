<script>
  // アクション名 → 引数なし(caseNoのみ)で呼べる google.script.run 側関数名
  const SIMPLE_ACTIONS = {
    createQuote: 'api_createQuote',
    recreateQuote: 'api_recreateQuote',
    exportQuotePdf: 'api_exportQuotePdf',
    createInvoice: 'api_createInvoice',
    recreateInvoice: 'api_recreateInvoice',
    exportInvoicePdf: 'api_exportInvoicePdf',
    createDelivery: 'api_createDelivery',
    exportDeliveryPdf: 'api_exportDeliveryPdf',
  };

  // アクション名 → コメント入力(comment引数あり)を伴って呼ぶ google.script.run 側関数名
  const COMMENT_ACTIONS = {
    completeQuote: 'api_completeQuote',
    approveQuote: 'api_approveQuote',
    rejectQuote: 'api_rejectQuote',
    completeInvoice: 'api_completeInvoice',
    approveInvoice: 'api_approveInvoice',
    rejectInvoice: 'api_rejectInvoice',
    cancelCase: 'api_cancelCase',
    finalApprove: 'api_finalApprove',
    restoreCase: 'api_restoreCase',
  };

  // 承認者の指定プルダウンを表示するアクション（見積書の承認依頼のみ）
  const APPROVER_SELECT_ACTION = 'completeQuote';

  let currentCaseNo = null;
  let pendingCommentAction = null;
  let isBusy = false;
  let pollTimer = null;
  let quoteApprovers = [];

  // 選択中セルの変化を反映するための定期取得。
  // サーバー呼び出し1回には1〜2秒かかるため、前の応答を待たずに一定間隔で問い合わせ、
  // 行を選び直してからサイドバーに反映されるまでの待ち時間を短くする（動作速度の改善）。
  // 同時に問い合わせ中にできる数には上限を設け、サーバーへの負荷が増えすぎないようにする。
  const POLL_INTERVAL_MS = 1000;
  const MAX_IN_FLIGHT = 3;
  let inFlight = 0;
  let requestSeq = 0;   // 問い合わせごとの通し番号
  let renderedSeq = 0;  // 画面に反映済みの最新の通し番号（古い応答で上書きしないため）
  let lastErrorShownAt = 0;

  document.addEventListener('DOMContentLoaded', () => {
    refreshData();
    startPolling();
    // 別のタブを見ている間は問い合わせを止め、戻ってきたらすぐに最新の状態を取りに行く
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPolling();
      } else {
        refreshData();
        startPolling();
      }
    });
  });

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => refreshData(), POLL_INTERVAL_MS);
  }

  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  /**
   * サイドバーの表示内容を取得する。
   * force=true は操作の完了直後など、問い合わせ中の数に関係なく必ず取りに行く場合に使う。
   */
  function refreshData(targetCaseNo, force) {
    if (isBusy) return; // 処理中は選択変更による再描画で競合しないようにする
    if (!force && inFlight >= MAX_IN_FLIGHT) return;
    const caseNoToFetch = targetCaseNo || currentCaseNo;
    const seq = ++requestSeq;
    inFlight++;
    google.script.run
      .withSuccessHandler(data => {
        inFlight--;
        // 後から送った問い合わせの応答が先に届いていれば、古い応答は捨てる
        if (seq < renderedSeq) return;
        renderedSeq = seq;
        renderData(data);
      })
      .withFailureHandler(err => {
        inFlight--;
        // 定期取得の失敗が続いても、同じエラーを短い間隔で何度も表示しない
        const now = Date.now();
        if (now - lastErrorShownAt < 10000) return;
        lastErrorShownAt = now;
        showToast(err && err.message ? err.message : String(err), true);
      })
      .api_getSidebarData(caseNoToFetch);
  }

  function renderData(data) {
    currentCaseNo = data.caseNo;
    quoteApprovers = data.quoteApprovers || [];
    const emptyState = document.getElementById('emptyState');
    const caseArea = document.getElementById('caseArea');

    if (!data.caseNo || !data.caseInfo) {
      emptyState.style.display = 'block';
      caseArea.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    caseArea.style.display = 'block';

    const info = data.caseInfo;
    document.getElementById('caseTitle').textContent = `${info.caseNo}　${info.caseName}`;
    document.getElementById('caseSub').textContent = `${info.clientName} ／ 担当: ${info.staffInCharge || '-'}`;
    document.getElementById('statusBadge').textContent = info.status || '-';
    document.getElementById('billingBadge').textContent = info.billingStatus || '-';

    // ボタンの活性/非活性を反映
    Object.keys(data.buttons || {}).forEach(action => {
      const el = document.querySelector(`[data-action="${action}"]`);
      if (!el) return;
      const state = data.buttons[action];
      el.disabled = !state.enabled;
      el.title = state.reason || '';
    });

    renderHistory(data.history || []);
  }

  function renderHistory(history) {
    const list = document.getElementById('historyList');
    if (!history.length) {
      list.innerHTML = '<div class="history-item"><span>まだ記録がありません</span></div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <span>${escapeHtml(h.label)}</span>
        <span class="who">${escapeHtml(h.who)}｜${escapeHtml(h.when)}</span>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /**
   * ボタン操作を受け付けられる状態か判定する。
   * 受け付けられない場合は、押しても何も起きない状態にならないよう理由を表示する。
   */
  function canRunAction() {
    if (isBusy) {
      showToast('前の処理が完了していません。しばらくお待ちください。', true);
      return false;
    }
    if (!currentCaseNo) {
      showToast('案件が選択されていません。シート上で案件の行をクリックしてから操作してください。', true);
      return false;
    }
    return true;
  }

  /** コメント不要な操作（作成・再作成・印刷・PDF出力）をそのまま実行する */
  function runSimple(action) {
    if (!canRunAction()) return;
    const fnName = SIMPLE_ACTIONS[action];
    if (!fnName) return;
    // 作成・再作成・PDF出力は結果のURLを新しいタブで開く。ブラウザはクリックから数秒を過ぎた
    // window.open をポップアップとしてブロックするため、クリックした時点で空のタブを開いておき、
    // 処理が終わったらそのタブへURLを読み込む。
    const pendingTab = openPendingTab();
    setBusy(true);
    google.script.run
      .withSuccessHandler(result => { setBusy(false); handleActionResult(result, pendingTab); refreshData(currentCaseNo, true); })
      .withFailureHandler(err => {
        setBusy(false);
        closePendingTab(pendingTab);
        showToast(err && err.message ? err.message : String(err), true);
      })
      [fnName](currentCaseNo);
  }

  /** 処理中に表示しておく空のタブを開く。ブロックされた場合は null */
  function openPendingTab() {
    const tab = window.open('', '_blank');
    if (!tab) return null;
    try {
      tab.document.title = '処理中…';
      tab.document.body.textContent = '処理中です。完了するとこのタブに書類が表示されます。';
    } catch (e) {
      // 表示文言を入れられなくても、タブ自体は使える
    }
    return tab;
  }

  function closePendingTab(tab) {
    if (tab && !tab.closed) tab.close();
  }

  /** コメント入力が必要な操作（完成／承認／差し戻し／最終承認）のモーダルを開く */
  function openComment(action, title) {
    if (!canRunAction()) return;
    pendingCommentAction = action;
    document.getElementById('commentModalTitle').textContent = title;
    document.getElementById('commentText').value = '';
    renderApproverField(action);
    document.getElementById('commentModal').classList.add('open');
  }

  /**
   * 承認者の指定プルダウンを組み立てる（見積書の承認依頼のときだけ表示）。
   * 未選択なら従来どおり総務全員へ通知されるため、任意項目として扱う。
   */
  function renderApproverField(action) {
    const field = document.getElementById('approverField');
    const select = document.getElementById('approverSelect');
    if (action !== APPROVER_SELECT_ACTION || !quoteApprovers.length) {
      field.style.display = 'none';
      select.innerHTML = '';
      return;
    }
    select.innerHTML = ['<option value="">指定しない（総務全員へ依頼）</option>']
      .concat(quoteApprovers.map(a => `<option value="${escapeHtml(a.email)}">${escapeHtml(a.name)}</option>`))
      .join('');
    field.style.display = 'block';
  }

  function closeComment() {
    pendingCommentAction = null;
    document.getElementById('commentModal').classList.remove('open');
  }

  function submitComment() {
    if (!pendingCommentAction || !currentCaseNo) return;
    const fnName = COMMENT_ACTIONS[pendingCommentAction];
    const comment = document.getElementById('commentText').value;
    const action = pendingCommentAction;
    // 承認者の指定は見積書の承認依頼のみ。未選択時は空文字を渡す（＝従来どおり総務全員へ）
    const approverEmail = (action === APPROVER_SELECT_ACTION)
      ? document.getElementById('approverSelect').value : '';
    closeComment();
    setBusy(true);
    const runner = google.script.run
      .withSuccessHandler(result => { setBusy(false); handleActionResult(result); refreshData(currentCaseNo, true); })
      .withFailureHandler(err => { setBusy(false); showToast(err && err.message ? err.message : String(err), true); });
    if (action === APPROVER_SELECT_ACTION) {
      runner[fnName](currentCaseNo, comment, approverEmail);
    } else {
      runner[fnName](currentCaseNo, comment);
    }
  }

  /**
   * 印刷/出力アクションの結果としてURLが返ってきた場合、新規タブで開く。
   * pendingTab（クリック時に開いておいた空のタブ）があればそこへ読み込み、URLが無ければ閉じる。
   */
  function handleActionResult(result, pendingTab) {
    const url = result && (result.printUrl || result.pdfUrl || result.url);
    if (url && pendingTab && !pendingTab.closed) {
      pendingTab.location.href = url;
    } else {
      closePendingTab(pendingTab);
      if (url) window.open(url, '_blank');
    }
    if (!result) return;
    showToast('処理が完了しました。');
  }

  function setBusy(busy) {
    isBusy = busy;
    document.getElementById('loading-overlay').classList.toggle('show', busy);
  }

  let toastTimer = null;
  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = isError ? 'show error' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 4000);
  }
</script>
